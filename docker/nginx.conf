# DashHub nginx configuration (complete main config)
#
# Temp/log paths are pinned to /tmp (tmpfs in the hardened compose file)
# so nginx runs cleanly with a read-only root filesystem.

worker_processes auto;
error_log stderr warn;
pid /tmp/nginx.pid;

# Explicit worker user (alpine nginx uid); master stays root to manage
# temp-dir ownership, workers run unprivileged.
user nginx;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Container-friendly logging: errors -> stderr, access log disabled
    access_log off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Writable temp paths (read-only root filesystem compatible; single-level
    # because nginx mkdir() does not create parent directories)
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # API proxy (^~ so the asset-cache regex below cannot intercept API
        # routes that end in image extensions, e.g. DELETE /api/uploads/xxx.png)
        location ^~ /api {
            proxy_pass http://127.0.0.1:48231;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket support for SSH
        location ^~ /api/ssh {
            proxy_pass http://127.0.0.1:48231;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Uploaded icons/images - served by the API from /app/data/uploads
        # (^~ so the generic asset-cache regex below does not intercept these)
        location ^~ /uploads {
            proxy_pass http://127.0.0.1:48231;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Static files and SPA fallback
        # HTML must revalidate every load so upgrades are picked up
        # immediately; hashed assets below stay immutable-cached.
        location / {
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
