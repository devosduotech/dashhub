#===============================================================================
# OSDuo DashHub - Docker Compose Configuration
#
# Directory Structure:
#   config/     - Configuration templates (default.yml)
#   data/       - Persistent data (conf.yml, known_hosts.json, uploads/)
#   .env        - Environment variables (copy from .env.example)
#
# Usage:
#   1. cp .env.example .env          # Customize environment variables
#   2. cp config/default.yml data/conf.yml  # Or edit via UI
#   3. docker compose up -d --build
#   4. Access: http://localhost:${HOST_PORT}
#===============================================================================

services:
  #============================================================
  # Main Dashboard Application
  # Single container includes:
  #   - Nginx: Static frontend files
  #   - Node.js API: Config management, SSH bridge
  #   - SSH Bridge: Native ssh2 library (no GoTTY required)
  #============================================================
  dashhub:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build arguments (if needed)
        - NODE_ENV=production
    container_name: dashhub
    restart: unless-stopped

    # Port mapping via environment variable
    ports:
      - "${HOST_PORT:-48215}:80"

    # Persistent volumes for configuration and data
    volumes:
      # Configuration file (persisted)
      - ./data:/app/data
      # Optional: Mount custom config template
      # - ./config/custom.yml:/app/config/custom.yml:ro

    # Environment variables from .env file
    env_file:
      - .env

    # Additional environment variables
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - API_PORT=${API_PORT:-48231}
      - TZ=${TZ:-UTC}
      # Config directory path (matches volume mount)
      - CONFIG_DIR=/app/data

    # Health check (checks the API, so "healthy" means the full stack is up)
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Network
    networks:
      - dashhub-network

    # Resource limits (optional)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.25'
    #       memory: 128M

#===============================================================================
# Network Configuration
#===============================================================================
networks:
  dashhub-network:
    driver: bridge
    name: dashhub-network

#===============================================================================
# Volume Definitions (if using named volumes)
#===============================================================================
# volumes:
#   dashhub-data:
#     name: dashhub-data
#   dashhub-config:
#     name: dashhub-config
