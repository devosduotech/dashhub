#===============================================================================
# OSDuo DashHub - Docker Compose Configuration (pre-built image)
#
# End-user installation: pulls the published image from GHCR. No build required.
#
# Directory Structure:
#   data/   - Persistent data (conf.yml, known_hosts.json, uploads/)
#   .env    - Environment variables (optional, defaults work out of the box)
#
# Usage:
#   1. mkdir data
#   2. docker compose up -d
#   3. Access: http://localhost:${HOST_PORT}
#
# Upgrade:
#   docker compose pull && docker compose up -d
#
# Developers: use docker-compose.dev.yml to build from source instead.
#===============================================================================

services:
  #============================================================
  # Main Dashboard Application
  # Single container includes:
  #   - Nginx: Static frontend files
  #   - Node.js API: Config management, SSH bridge
  #   - SSH Bridge: Native ssh2 library (no GoTTY required)
  #============================================================
  dashhub:
    image: ghcr.io/devosduotech/dashhub:1.0.5
    container_name: dashhub
    restart: unless-stopped

    # Port mapping via environment variable
    ports:
      - "${HOST_PORT:-48215}:80"

    # Persistent volumes for configuration and data
    volumes:
      # Configuration file (persisted)
      - ./data:/app/data

    # Environment variables (defaults work; override via .env)
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - API_PORT=${API_PORT:-48231}
      - TZ=${TZ:-UTC}
      # Config directory path (matches volume mount)
      - CONFIG_DIR=/app/data

    # Health check (checks the API, so "healthy" means the full stack is up)
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Network
    networks:
      - dashhub-network

#===============================================================================
# Network Configuration
#===============================================================================
networks:
  dashhub-network:
    driver: bridge
    name: dashhub-network
