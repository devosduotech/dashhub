#===============================================================================
# OSDuo DashHub - Developer Compose Override (build from source)
#
# Usage (from the repository root):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Merges with docker-compose.yml; overrides the pre-built GHCR image with a
# local build so developers can work against the current source tree.
#
# Runs as dashhub-dev on a separate host port (48216) so it can run in
# parallel with the released image container (dashhub on 48215).
#===============================================================================

services:
  dashhub:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build arguments (if needed)
        - NODE_ENV=production
    image: ghcr.io/devosduotech/dashhub:dev
    container_name: dashhub-dev
    ports: !override
      - "${HOST_PORT_DEV:-48216}:80"